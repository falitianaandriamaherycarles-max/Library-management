# Configuration des tests de régression
regression.test.data.path=src/test/resources/test-data/
regression.baseline.dir=baseline/
regression.report.dir=reports/regression/
regression.timeout.seconds=300
regression.parallel.execution=true
regression.thread.count=4
regression.retry.count=3

# Seuils de performance
performance.max.response.time.ms=100
performance.max.memory.mb=512
performance.max.cpu.percent=80

# Exclusions de tests
regression.exclude.tests=com.library.performance.*

# Comparaison baseline
baseline.enabled=true
baseline.compare.test.results=true
baseline.compare.coverage=true
baseline.coverage.threshold=0.80

# Notifications
notification.enabled=true
notification.email=qa-team@example.com
notification.slack.channel=#regression-tests

# Report
report.generate.html=true
report.generate.json=true
report.include.detailed.logs=true